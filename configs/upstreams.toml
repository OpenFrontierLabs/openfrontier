# Every upstream Open Frontier Labs builds on, pinned to an exact commit.
# `ofl fetch <name>` clones the repo into .cache/upstreams/<name> and checks out `sha`.
# Verified with `git ls-remote` / `gh api` on `verified`. Nothing is vendored.
# To bump a pin: change `ref` and `sha` together, re-run `ofl run0 verify` / `ofl moe verify`.

[olmo-core]
repo = "https://github.com/allenai/OLMo-core"
ref = "v3.0.0"
sha = "a800c06edcec8e4652de2f80fe0ea572d689fcc3"
license = "Apache-2.0"
verified = "2026-11-12"
used-by = "phase1-dense: ofl run0 launch (src/examples/llm/train.py); ofl smoke (olmo_core trainer on CPU)"
note = "Latest release at verification. Default branch was 2289b819b8f709e37e3e042ebb019f411fb6b742 (2026-11-10), not used."

