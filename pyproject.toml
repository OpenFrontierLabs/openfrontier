[project]
name = "ofl"
version = "0.0.1"
description = "Open Frontier Labs command line: doctor, smoke test, Run 0 launcher, ledger checks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.10,<2.14",
    "jsonschema>=4.23",
    "certifi",
    # Pinned to the commit behind release v3.0.0 (configs/upstreams.toml: olmo-core).
    "ai2-olmo-core",
]

[project.scripts]
ofl = "ofl.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofl"]

# CPU-only torch everywhere: the smoke tests are CPU. GPU runs use the upstream's own
# environment on the node (see docs/run0.md), not this one.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
ai2-olmo-core = { git = "https://github.com/allenai/OLMo-core", rev = "a800c06edcec8e4652de2f80fe0ea572d689fcc3" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ofl.smoke.*"]
# torch and olmo_core are skipped (huge, untyped in places): their classes are Any here.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["torch.*", "olmo_core.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
