version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        dependency-type: development
      python:
        dependency-type: production
        update-types: [minor, patch]
    # ai2-olmo-core (pinned in pyproject.toml) requires torch>=2.10,<2.14 and filelock<4, so
    # newer releases cannot resolve and fail the run. Lift these when the pin moves.
    ignore:
      - dependency-name: torch
        versions: [">=2.14"]
      - dependency-name: filelock
        versions: [">=4"]
    commit-message:
      prefix: deps
    labels: [type/chore, area/python]
