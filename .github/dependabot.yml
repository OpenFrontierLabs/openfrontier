version: 2
updates:
  - package-ecosystem: uv
    directory: /smoke
    schedule:
      interval: weekly
    groups:
      python-dev:
        dependency-type: development
      python:
        dependency-type: production
        update-types: [minor, patch]
    # ai2-olmo-core (pinned in smoke/pyproject.toml) requires torch>=2.10,<2.14, so newer torch cannot
    # resolve and fails the run. Lift this when the pin moves. filelock needs no ignore: its cap
    # is lifted by override-dependencies in smoke/pyproject.toml.
    ignore:
      - dependency-name: torch
        versions: [">=2.14"]
    commit-message:
      prefix: deps
    labels: [type/chore, area/python]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels: [type/chore, area/rust]
