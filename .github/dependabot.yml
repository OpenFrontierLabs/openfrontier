version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [type/chore]
  - package-ecosystem: uv
    directory: /smoke
    schedule:
      interval: weekly
    groups:
      python-dev:
        dependency-type: development
    commit-message:
      prefix: deps
    labels: [type/chore, area/python]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels: [type/chore, area/rust]
