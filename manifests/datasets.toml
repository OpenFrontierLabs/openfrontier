[[mix]]
name = "OLMo-mix-0625-official"
defined-in = "olmo-core"
path = "src/olmo_core/data/mixes/OLMo-mix-0625-official.txt"
base-url = "https://olmo-data.org"
tokenizer = "allenai/dolma2-tokenizer"
used-by = "configs/phase1-dense/run0.toml"
note = "1016 shard paths of the form preprocessed/dolma3-0625/v0.1-official/{TOKENIZER}/<source>/<n>.npy. Streamed over HTTPS unless you download the shards."

[[tokenizer]]
id = "allenai/dolma2-tokenizer"
url = "https://huggingface.co/allenai/dolma2-tokenizer"
revision = "5292e5d6c0f40b67cc765fe41bec991cf4345b5c"
licence = "not declared in the Hugging Face card metadata at the revision above"
vocab-size = 100278
used-by = "phase1-dense"
note = "Confirm the licence with Ai2 before releasing weights that ship this tokenizer."

[[tokenizer]]
id = "unsloth/Llama-3.2-1B"
url = "https://huggingface.co/unsloth/Llama-3.2-1B"
revision = "9535bd9b1d1dea6acafbdc4813b728796aeb28da"
