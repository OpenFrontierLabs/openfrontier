# Data manifest. Dataset ids, licences and revisions as read from the Hugging Face API
# (https://huggingface.co/api/datasets/<id>) on 2026-11-12. No content hashes are recorded
# because none were computed: a revision is a Hugging Face git commit, nothing more.
# "licence" is what the dataset card metadata says. It is not a legal audit of every
# source inside the dataset.

[[dataset]]
id = "HuggingFaceFW/fineweb-edu"
url = "https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu"
revision = "87f09149ef4734204d70ed1d046ddc9ca3f2b8f9"
licence = "ODC-By 1.0"
gated = false
phase = "phase1-dense, phase1-moe"
format = "parquet text; must be tokenised before OLMo-core or Megatron can read it"
note = "Cite: ODC-By requires attribution. Tokenisation is not built into ofl; see docs/run0.md."

[[dataset]]
id = "allenai/dolma3_mix-6T-1025-7B"
