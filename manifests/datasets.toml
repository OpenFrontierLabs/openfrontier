vocab-size = 128256
used-by = "phase1-moe, only to reproduce the handbook's parameter counts"
note = "The handbook uses this tokenizer. Open Frontier Labs releases weights under Apache-2.0 with no use restrictions, so this tokenizer is not our default; configs/phase1-moe/ takes the tokenizer directory as an argument."

