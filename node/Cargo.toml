[package]
name = "ofl-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Open Frontier Node device identity: Ed25519 keypair, signed hardware report"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
hex = "0.4.3"
libp2p = { version = "0.57.1", features = ["tokio", "quic", "tcp", "noise", "yamux", "identify", "kad", "macros"] }
libp2p-identity = { version = "0.3.1", default-features = false, features = ["ed25519", "peerid", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
