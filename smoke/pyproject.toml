[project]
name = "ofl-smoke"
version = "0.1.0"
description = "Open Frontier Labs CPU training smokes: the pinned OLMo-core trainer and a reference DiLoCo"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.10,<2.14",
    "certifi",
    # Pinned to the commit behind release v3.0.0 (configs/upstreams.toml: olmo-core).
    "ai2-olmo-core",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smoke"]

# CPU-only torch: the smokes are CPU. GPU runs use the upstream's own environment
# on the node (see docs/run0.md), not this one.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
ai2-olmo-core = { git = "https://github.com/allenai/OLMo-core", rev = "a800c06edcec8e4652de2f80fe0ea572d689fcc3" }

[tool.uv]
# cached-path 1.8.10 and ai2-olmo-core v3.0.0 both cap filelock<4.0, but every release up to
# 4.2.0 is unpatched: Dependabot alerts 1-13 (13 GHSAs), all fixed in 4.2.1. Both consumers
# use only the FileLock API that 4.x keeps.
override-dependencies = ["filelock>=4.2.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true