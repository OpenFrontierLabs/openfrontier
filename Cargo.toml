[package]
name = "ofl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Open Frontier Labs command line: doctor, smoke test, Run 0 launcher, ledger checks"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
httpdate = "1.0.3"
jsonschema = "0.58.6"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["fs"] }
serde_json = "1.0.154"
shlex = "1.3.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
# HEAD probes only: rustls with the ring provider (no C toolchain), no gzip.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"

# Canonical Algodyne lint profile (common/lint/workspace-lints.toml).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes = "deny"
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"